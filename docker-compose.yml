services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: projectkitchen:latest
    container_name: fridge_recipe_tracker
    ports:
      - "5000:5000"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data

  test:
    build:
      context: .
      dockerfile: Dockerfile
    image: projectkitchen:latest
    container_name: fridge_recipe_tracker_test
    # Deliberately no env_file / API key: the suite must pass fully offline
    command: ["python", "-m", "unittest", "discover", "-s", "tests", "-t", ".", "-v"]
