name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint & test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint (syntax errors & undefined names)
        run: ruff check --select E9,F63,F7,F82 .

      - name: Compile check
        run: python -m compileall -q main.py src tests

      - name: Run offline test suite (no API key provided)
        env:
          GEMINI_API_KEY: ""
        run: python tests/test_pipeline.py

  docker:
    name: Docker build & containerised tests
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t projectkitchen:ci .

      - name: Run test suite inside container
        run: docker run --rm projectkitchen:ci python tests/test_pipeline.py

      - name: Smoke test CLI starts and exits cleanly
        run: printf '1\n\n7\n' | docker run --rm -i projectkitchen:ci
