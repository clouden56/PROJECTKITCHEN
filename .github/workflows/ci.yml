name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint & test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint (syntax errors, undefined names, unused imports and variables)
        run: ruff check --select E9,F .

      - name: Run offline test suite (no API key provided)
        env:
          GEMINI_API_KEY: ""
        run: python -m unittest discover -s tests -t . -v

  docker:
    name: Docker build, containerised tests & web smoke test
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t projectkitchen:ci .

      - name: Run test suite inside container
        run: docker run --rm projectkitchen:ci python -m unittest discover -s tests -t .

      - name: Start web app and check the pages respond
        run: |
          docker run -d --name web -p 5000:5000 projectkitchen:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:5000/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:5000/ | grep -q "Fridge Recipe Tracker"
          curl -fsS http://127.0.0.1:5000/history | grep -q "Recipe history"
          curl -fsS http://127.0.0.1:5000/recipes/new | grep -q "Suggest a recipe"

      - name: Show container logs on failure
        if: failure()
        run: docker logs web || true
